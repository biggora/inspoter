name: inspoter-test
services:
  db-test:
    image: ghcr.io/biggora/postgres-postgis-pgvector:v1.0.0@sha256:7b23a45f31ef203cba4a27a341327ae1351c6775afbc0a3928c746fcf852f8e3
    environment:
      POSTGRES_USER: inspoter_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: inspoter_e2e_test
    ports:
      - "127.0.0.1:3833:5432"
    volumes:
      - test-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspoter_test -d inspoter_e2e_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

volumes:
  test-db-data:
